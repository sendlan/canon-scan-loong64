# 佳能 PIXMA / MAXIFY 一体机 —— 机型能力表
#
# 用途：让本包的工具与 udev 规则覆盖全部已知机型，而不是只认一台。
# 数据性质：USB 产品 ID 与机型能力位都是**客观接口事实**（硬件标识与
#           固件对外公布的能力标志），不是佳能软件的表达，故本表为
#           本项目独立编写，按 USB 产品 ID 升序排列，与原厂文件的
#           排列方式无关。
# 许可：本文件为独立编写的原创内容，随 canon-scanner-native 以
#       GPL-2.0-or-later 分发。
#
# ⚠ 表中出现的机型名称（PIXMA / MAXIFY / LiDE / TS / MG / MB / GX / XK / E /
#   G / TR 等系列代号及型号名）是 Canon Inc. 的商标，此处仅用于指明本软件
#   与哪些设备兼容。Canon Inc. 未参与本软件的开发，也不为本软件提供支持。
#
# ── 格式 ────────────────────────────────────────────────────────────────
#     <USB 产品 ID>  <能力码>  <机型名>
#
#   产品 ID ：4 位十六进制（04a9:xxxx 的 xxxx）
#   能力码  ：4 位十六进制位域，位定义见下
#   机型名  ：仅供显示与文档，可含空格
#   以 # 开头的行与空行为注释
#
# ── 能力码位定义 ────────────────────────────────────────────────────────
#   bit 0   平板稿台（flatbed）
#   bit 1   单面 ADF
#   bit 2   双面 ADF
#   bit 4   USB 连接
#   bit 5   网络扫描（BJNP 旧协议：TCP 8612）
#   bit 6   网络扫描（NET2 佳能私有 IVEC/CHMP 栈 —— 本项目网络通道走这条）
#   bit 8-11 协议库版本
#   bit 12  A5 稿台机型：可扫纸型与常规机型不同（不支持 A4 / Letter / B5 /
#          2L_L，改支持 A5 与 Statement 140×216mm）
#
# ── 统计（4.90 机型表，162 项）──────────────────────────────────────────
#   仅 USB            8 项
#   USB + BJNP 网络   21 项
#   USB + NET2 网络  133 项
#   其中 A5 稿台机型   1 项（GX6500 series, 1148）
#
